[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meyro"
version = "0.0.1"
description = "MEYRO — AI that learns your normal. Personalized longitudinal baselines for meaningful deviation detection. Research software; not a medical diagnostic system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Arghya Bose", email = "officialarghya29@gmail.com" }]
keywords = [
  "personalized-anomaly-detection",
  "longitudinal-health-monitoring",
  "digital-phenotyping",
  "time-series",
  "explainable-ai",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/officialarghya29/meyro"
Repository = "https://github.com/officialarghya29/meyro"
Issues = "https://github.com/officialarghya29/meyro/issues"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Tooling configuration (single source of truth)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["meyro"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# src/ layout: make `import meyro` work without an editable install.
pythonpath = ["src"]
addopts = "-ra -q"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["meyro"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
