<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="MEYRO — AI that learns your normal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#000c24"/>
      <stop offset="100%" stop-color="#001826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#48d8f0"/>
      <stop offset="100%" stop-color="#90f0c0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48d8f0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#48d8f0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#48d8f0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

  <!-- left spine accent -->
  <rect x="60" y="70" width="3" height="200" fill="url(#fade)"/>

  <!-- wordmark -->
  <text x="100" y="168" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="700" letter-spacing="14" fill="url(#accent)" filter="url(#glow)">MEYRO</text>

  <text x="104" y="212" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="600" letter-spacing="7" fill="#e8f4f8" opacity="0.92">AI THAT LEARNS YOUR NORMAL</text>

  <text x="104" y="262" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="14" font-weight="400" letter-spacing="2" fill="#8fb6c9" opacity="0.8">PERSONALIZED LONGITUDINAL BASELINES · DEVIATION DETECTION · NOT A DIAGNOSIS</text>

  <!-- pulse motif -->
  <g transform="translate(1000,170)" stroke="url(#accent)" fill="none" stroke-width="2.5" stroke-linecap="round">
    <polyline points="0,0 40,0 58,-52 78,58 98,-30 116,0 160,0" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="url(#accent)"/>
    <circle cx="160" cy="0" r="4" fill="url(#accent)"/>
  </g>
</svg>
